<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤 - 마이페이지</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/mypage.css">
</head>
<body>
    <header>
        <div>
            <a href="../html/main.html">
                <div id="logo_box">
                    <h1><img src="../image/logo.png" alt="로고">커뮤</h1>
                </div>
            </a>
        </div>
    </header>
    <main>
        <div id="mypage_box">
            <h2>마이페이지</h2>
            <div class="user_input_box">
                <label>이메일</label>
                <input type="text" id="user_id" readonly value="user123">
            </div>

            <div class="user_input_box">
                <label>아이디</label>
                <input type="text" id="user_name" readonly value="홍길동">
            </div>
            <hr>
            <h3 class="center_title">비밀번호 변경</h3>
            <form id="pw_change_form">
                <div class="user_input_box">
                    <label for="new_pw">새 비밀번호</label>
                    <input type="password" id="new_pw" placeholder="새 비밀번호 입력" required>
                </div> 
                <div class="button_center">
                    <button type="submit" class="info_button">비밀번호 변경</button>
                </div>
            </form>
            <hr>
            <div id="withdraw_box" class="button_center">
                <button type="button" id="delete_button" class="info_button">회원 탈퇴</button>
            </div>
        </div>
    </main>
    <footer id="bottom"></footer>
    <script src="../js/mypage.js"></script>
</body>
</html>
