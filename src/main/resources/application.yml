
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:project;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
jwt:
  # 운영 환경에서는 반드시 환경 변수로 32바이트 이상 Base64 키를 지정하세요.
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRoaXJ0eS10d28tYnl0ZXM=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
